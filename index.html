<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Margin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Margin">
<meta name="theme-color" content="#F3F5F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0E0D" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: iOS grouped-list app, one 430px column, large titles, floating tab bar, bottom sheets, full-screen setup flow. */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --surface-2:#EAEEEC; --fg:#0D1412; --muted:#64716D; --faint:#9AA6A2;
  --line:rgba(13,20,18,.08); --accent:#0C8A79; --accent-ink:#FFFFFF; --accent-soft:rgba(12,138,121,.11);
  --danger:#D8443B; --warn:#C3860E; --good:#178F55;
  --bar-bg:rgba(243,245,244,.8); --shadow:0 1px 2px rgba(13,20,18,.04),0 8px 24px rgba(13,20,18,.06);
  --scrim:rgba(8,12,11,.32);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;
  --font-num:ui-rounded,"SF Pro Rounded",Nunito,-apple-system,system-ui,sans-serif;
  --ease:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.34,1.4,.5,1);
  --r-card:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0E0D; --surface:#151A19; --surface-2:#1F2624; --fg:#EDF2F0; --muted:#8C9A96; --faint:#5E6A67;
  --line:rgba(255,255,255,.07); --accent:#2BC2AC; --accent-ink:#04110E; --accent-soft:rgba(43,194,172,.14);
  --danger:#FF6A5F; --warn:#F2B440; --good:#3FCB85;
  --bar-bg:rgba(11,14,13,.74); --shadow:none; --scrim:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0E0D; --surface:#151A19; --surface-2:#1F2624; --fg:#EDF2F0; --muted:#8C9A96; --faint:#5E6A67;
  --line:rgba(255,255,255,.07); --accent:#2BC2AC; --accent-ink:#04110E; --accent-soft:rgba(43,194,172,.14);
  --danger:#FF6A5F; --warn:#F2B440; --good:#3FCB85;
  --bar-bg:rgba(11,14,13,.74); --shadow:none; --scrim:rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.35;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)}

.app{max-width:430px;margin:0 auto;min-height:100%;position:relative;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(110px + env(safe-area-inset-bottom,0px))}
.screen{display:flex;flex-direction:column;gap:22px;padding-top:calc(14px + env(safe-area-inset-top,0px));animation:fade .35s var(--ease)}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:6px}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em}
h1{font-size:34px;line-height:1.05;font-weight:700;letter-spacing:-.025em;margin:2px 0 0;text-wrap:balance}
.head-actions{display:flex;gap:6px}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);color:var(--fg);transition:transform .2s var(--spring)}
.icon-btn:active{transform:scale(.9)}
.icon-btn svg{width:18px;height:18px}
.icon-btn[disabled]{opacity:.35}

.banner{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;border-radius:14px;background:var(--accent-soft);font-size:14px}
.banner b{font-weight:600}
.banner .sp{flex:1}
.banner button{font-weight:600;color:var(--accent);padding:6px 8px}

.card{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow)}
.hero{padding:20px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.label{font-size:13px;color:var(--muted);font-weight:500}
.big{font-size:44px;font-weight:800;line-height:1;margin:6px 0 8px;letter-spacing:-.03em}
.big.neg{color:var(--danger)}
.sub{font-size:14px;color:var(--muted)}
.sub b{color:var(--fg);font-weight:600}
.ring{width:96px;height:96px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--surface-2)}
.ring .val{stroke:var(--accent);transition:stroke-dashoffset 1s var(--ease)}
.ring .val.over{stroke:var(--danger)}
.ring .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .pct{font-size:20px;font-weight:800}
.ring .cap{font-size:11px;color:var(--muted);margin-top:-2px}
.stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding-top:14px;gap:8px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:17px;font-weight:700;margin-top:2px}
.stat .v.in{color:var(--good)}

.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px;gap:10px}
.sec-h h2{font-size:20px;font-weight:700;letter-spacing:-.015em;margin:0}
.sec-h .aside{font-size:14px;color:var(--muted)}
.sec-h button{font-size:15px;color:var(--accent);font-weight:500}
.group{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden}
.day-h{font-size:13px;font-weight:600;color:var(--muted);padding:0 4px;display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:.05em}

.row-wrap{position:relative;overflow:hidden}
.row-wrap + .row-wrap .row::before{content:"";position:absolute;top:0;left:64px;right:0;height:1px;background:var(--line)}
.row-wrap:not(.swiping) .row-del{visibility:hidden}
.row-del{position:absolute;inset:0 0 0 auto;width:88px;background:var(--danger);color:#fff;font-weight:600;font-size:15px;display:grid;place-items:center}
.row{position:relative;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);touch-action:pan-y;transition:transform .35s var(--ease);width:100%;text-align:left}
.row.dragging{transition:none}
.row.tap:active{background:var(--surface-2)}
.ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none}
.ico svg{width:19px;height:19px}
.ico.big{width:60px;height:60px;border-radius:18px}
.ico.big svg{width:30px;height:30px}
.meta{flex:1;min-width:0}
.t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{font-size:13px;color:var(--muted);margin-top:1px}
.amt{font-weight:700;font-size:16px;white-space:nowrap}
.amt.in{color:var(--good)}
.chev{width:16px;height:16px;color:var(--faint);flex:none}

.bud{display:flex;flex-direction:column;gap:8px;padding:14px 16px;width:100%;text-align:left}
.bud + .bud{border-top:1px solid var(--line)}
.bud.tap:active{background:var(--surface-2)}
.bud-top{display:flex;align-items:center;gap:12px}
.bud-top .t{font-weight:600}
.r{text-align:right}
.r .v{font-weight:700}
.r .v.over{color:var(--danger)}
.r .k{font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);position:relative}
.bar .fill{position:absolute;inset:0 auto 0 0;border-radius:99px;transition:width .9s var(--ease)}
.bar .pace{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:2px;background:var(--fg);opacity:.45}
.pill{font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.pill.neutral{background:var(--surface-2);color:var(--muted)}
.grp-h{display:flex;align-items:center;gap:8px;padding:14px 16px 4px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.grp-h .dot{width:8px;height:8px;border-radius:50%}
.grp-h .sp{flex:1}
.grp-h .num{text-transform:none;letter-spacing:0;font-weight:600}

.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:12px;padding:9px 12px;color:var(--muted);flex:none}
.search svg{width:17px;height:17px;flex:none}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:16px}
.search input::placeholder{color:var(--muted)}

.chart{padding:18px 16px 14px}
.chart .k{font-size:13px;color:var(--muted)}
.chart .v{font-size:28px;font-weight:800;margin:4px 0 14px}
.chart svg{width:100%;display:block;overflow:visible}
.axis{font-size:10px;fill:var(--muted);font-family:var(--font)}
.gridl{stroke:var(--line)}
.legend{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:10px;padding:2px;flex:none}
.seg button{padding:8px 4px;font-size:14px;font-weight:600;border-radius:8px;color:var(--muted);transition:color .2s,background .25s,box-shadow .25s}
.seg button[aria-pressed="true"]{color:var(--fg);background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button[disabled]{opacity:.4}

.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));
  width:min(398px,calc(100% - 2*max(16px,env(safe-area-inset-left,0px))));height:64px;border-radius:32px;
  background:var(--bar-bg);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;align-items:center;padding:0 6px;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--muted);padding:6px 0;transition:color .2s}
.tab svg{width:23px;height:23px;transition:transform .3s var(--spring)}
.tab[aria-current="page"]{color:var(--accent)}
.tab:active svg{transform:scale(.85)}
.add{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;justify-self:center;
  box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent);transition:transform .25s var(--spring)}
.add:active{transform:scale(.88)}
.add svg{width:24px;height:24px}

.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .4s var(--ease);z-index:30}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:min(430px,100%);transform:translate(-50%,105%);z-index:31;
  background:var(--surface);border-radius:28px 28px 0 0;transition:transform .5s var(--ease);
  padding:6px max(18px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;
  box-shadow:0 -10px 40px rgba(0,0,0,.18);max-height:94%;overflow:hidden}
.sheet:not(.open){visibility:hidden;transition:transform .5s var(--ease),visibility 0s .5s}
.sheet.open{transform:translate(-50%,0)}
.sheet.dragging{transition:none}
.sheet-body{display:flex;flex-direction:column;gap:14px;overflow-y:auto;margin:0 calc(-1*max(18px,env(safe-area-inset-left,0px)));padding:2px max(18px,env(safe-area-inset-left,0px));-webkit-overflow-scrolling:touch}
.grab{height:20px;display:grid;place-items:center;touch-action:none;cursor:grab;flex:none}
.grab i{width:38px;height:5px;border-radius:3px;background:var(--faint);opacity:.5}
.sheet-h{display:flex;justify-content:space-between;align-items:center;flex:none;gap:8px}
.sheet-h button{font-size:16px;color:var(--accent);font-weight:500;min-width:64px;text-align:left}
.sheet-h > :last-child{text-align:right;min-width:64px}
.sheet-h .title{font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amount{text-align:center;font-size:56px;font-weight:800;line-height:1;padding:6px 0 0;letter-spacing:-.03em;min-height:62px}
.amount .cur{color:var(--muted);font-weight:700;font-size:.6em;vertical-align:.32em;margin-right:2px}
.amount.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.amount.in{color:var(--good)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*max(18px,env(safe-area-inset-left,0px)));padding:2px max(18px,env(safe-area-inset-left,0px));flex:none}
.screen .chips{margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:2px max(16px,env(safe-area-inset-left,0px))}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px 7px 7px;border-radius:99px;background:var(--surface-2);font-size:14px;font-weight:600;white-space:nowrap;transition:transform .25s var(--spring),background .2s,box-shadow .2s;flex:none}
.screen .chip{background:var(--surface);box-shadow:var(--shadow)}
.chip .ico{width:24px;height:24px;border-radius:50%}
.chip .ico svg{width:14px;height:14px}
.chip[aria-pressed="true"]{background:var(--surface);box-shadow:0 0 0 2px var(--accent)}
.chip:active{transform:scale(.94)}
.chip.plain{padding:8px 14px}
.chip.more{color:var(--accent)}
.wrapchips{display:flex;flex-wrap:wrap;gap:8px}
.onb .chip{background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.onb .chip[aria-pressed="true"]{background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent)}
.fields{display:grid;grid-template-columns:1fr auto;gap:8px;flex:none}
.field{background:var(--surface-2);border-radius:12px;padding:12px 14px;border:0;outline:none;font-size:16px;min-width:0;width:100%}
.field::placeholder{color:var(--muted)}
.field[type="date"]{width:142px;-webkit-appearance:none;appearance:none}
.flabel{font-size:13px;font-weight:600;color:var(--muted);margin:0 4px -6px}
.money{position:relative}
.money::before{content:"$";position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600;pointer-events:none}
.money .field{padding-left:28px;font-family:var(--font-num);font-weight:700;font-variant-numeric:tabular-nums}
.money .field::placeholder{color:var(--faint);font-weight:500}
.pctf{position:relative}
.pctf::after{content:"%";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600;pointer-events:none}
.pctf .field{font-family:var(--font-num);font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;flex:none}
.key{height:50px;border-radius:14px;font-size:25px;font-weight:600;font-family:var(--font-num);transition:background .15s,transform .15s}
.key:active{background:var(--surface-2);transform:scale(.95)}
.key svg{width:24px;height:24px;margin:auto;display:block}
.btn{height:54px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-size:17px;font-weight:700;transition:transform .2s var(--spring),opacity .2s;width:100%;flex:none}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.screen .btn.ghost{background:var(--surface);box-shadow:var(--shadow)}
.btn.danger{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
.link{color:var(--accent);font-weight:600;font-size:15px;padding:10px;text-align:center}
.picker{position:absolute;inset:0;background:var(--surface);z-index:2;display:flex;flex-direction:column;padding:6px max(18px,env(safe-area-inset-left,0px)) 0;gap:12px;transform:translateY(102%);transition:transform .45s var(--ease)}
.picker.open{transform:none}
.picker .list{overflow-y:auto;flex:1;margin:0 calc(-1*max(18px,env(safe-area-inset-left,0px)));padding:0 max(18px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px))}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 6px;padding:6px 0 12px}
.pcell{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 2px;border-radius:14px;font-size:11.5px;font-weight:500;text-align:center;line-height:1.15}
.pcell:active{background:var(--surface-2)}
.pcell .ico{width:46px;height:46px;border-radius:15px}
.pcell .ico svg{width:22px;height:22px}
.pcell[aria-pressed="true"] .ico{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.iconpick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.iconpick button{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--fg)}
.iconpick button svg{width:20px;height:20px}
.iconpick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.range{width:100%;accent-color:var(--accent);height:28px}

.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);background:var(--fg);color:var(--bg);
  padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:60;transition:transform .5s var(--spring);display:flex;gap:10px;align-items:center;white-space:nowrap;max-width:calc(100% - 32px)}
.toast:not(.show){visibility:hidden;transition:transform .5s var(--spring),visibility 0s .5s}
.toast.show{transform:translate(-50%,0)}
.toast button{color:var(--accent);font-weight:700}

.empty{text-align:center;color:var(--muted);padding:28px 20px;font-size:15px;line-height:1.45}
.empty b{display:block;color:var(--fg);font-size:17px;margin-bottom:4px}
.danger-t{color:var(--danger)}
.foot{font-size:13px;color:var(--muted);padding:0 4px;line-height:1.45;margin:0}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:16px;overflow:hidden;flex:none}
.kv > div{background:var(--surface-2);padding:12px 14px}
.kv .k{font-size:12px;color:var(--muted)}
.kv .v{font-size:18px;font-weight:700;margin-top:2px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border-radius:18px;padding:14px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;position:relative;text-align:left;transition:box-shadow .2s}
.opt[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.opt .n{font-weight:700;font-size:15px}
.opt .d{font-size:12px;color:var(--muted);line-height:1.3}
.opt .v{font-size:20px;font-weight:800;margin-top:6px}
.opt .tag{align-self:flex-start;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:99px;margin-bottom:2px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:20px;font-weight:600;transition:transform .2s var(--spring)}
.stepper button:active{transform:scale(.85)}
.stepper .num{min-width:64px;text-align:center;font-weight:800;font-size:18px}
.loan-card{padding:16px;display:flex;flex-direction:column;gap:12px;width:100%;text-align:left;transition:transform .2s var(--spring)}
.loan-card:active{transform:scale(.985)}

// ---------- Loan math ----------
// Month-by-month payoff. `extra` (cents) goes on top of minimums; minimums freed by paid-off loans roll into the next target.
function simulate(loans, extra=0, strategy='avalanche'){
  let ls = loans.filter(l=>l.balance>0).map(l=>({id:l.id, bal:l.balance/100, r:(l.apr||0)/1200, pay:l.payment/100}));
  const series = [ls.reduce((s,l)=>s+l.bal,0)], payoff = {}; let interest = 0, m = 0;
  const budget = ls.reduce((s,l)=>s+l.pay,0) + extra/100;
  while (ls.length){
    m++;
    ls.forEach(l=>{ const i = l.bal*l.r; interest += i; l.bal += i; });
    let pool = budget;
    ls.forEach(l=>{ const p = Math.min(l.pay, l.bal); l.bal -= p; pool -= p; });
    const order = [...ls].sort(strategy==='snowball' ? (a,b)=>a.bal-b.bal : (a,b)=>b.r-a.r || a.bal-b.bal);
    for (const l of order){ if (pool<=0) break; const p = Math.min(pool, l.bal); l.bal -= p; pool -= p; }
    ls = ls.filter(l=>{ if (l.bal < .005){ payoff[l.id] = m; return false; } return true; });
    series.push(ls.reduce((s,l)=>s+l.bal,0));
    if (ls.length && (m>=600 || (m>1 && series[m] >= series[m-1] - .001))) return {months:null, interest:Infinity, series, payoff};
  }
  return {months:m, interest:Math.round(interest*100), series, payoff};
}

const isGoal = c => c.group==='financial' && c.id!=='fees' && c.id!=='taxes';
function statusOf(spent, budget, pace, fixed, goal){
  if (fixed) return spent ? ['ok','Paid','var(--accent)'] : ['neutral','Due','var(--faint)'];
  if (goal) return spent>=budget && budget ? ['ok','Goal met','var(--good)'] : ['ok', spent?'Saving':'Not started','var(--good)'];
  if (!budget) return spent ? ['bad','No budget set','var(--danger)'] : ['neutral','No budget','var(--faint)'];
  const r = spent/budget;
  if (r>1.001) return ['bad','Over budget','var(--danger)'];
  if (pace>0 && r > pace*1.1 && r>.25) return ['warn','Spending fast','var(--warn)'];
  return ['ok','On track','var(--accent)'];
}

function niceMax(v){ const d = v/100; const p = Math.pow(10, Math.floor(Math.log10(d||1))); return [1,2,2.5,5,10].find(x=>x*p>=d)*p*100; }

  // Savings goals are not spending money, so they stay out of "left to spend".
  const flexCats = d.cats.filter(c=>!c.fixed && !isGoal(c)), flexBudget = flexCats.reduce((s,c)=>s+budgetOf(c.id),0), flexSpent = flexCats.reduce((s,c)=>s+(d.spentBy[c.id]||0),0);
  const flexLeft = flexBudget - flexSpent, perDay = daysLeft>0 ? Math.max(0,flexLeft)/daysLeft : 0;
  const top = flexCats.filter(c=>budgetOf(c.id)||d.spentBy[c.id]).sort((a,b)=>((d.spentBy[b.id]||0)/budgetOf(b.id))-((d.spentBy[a.id]||0)/budgetOf(a.id))).slice(0,4);
  const fixedCats = d.cats.filter(c=>c.fixed), dueOf = c => d.spentBy[c.id] ? 0 : budgetOf(c.id);
  const fixedDue = fixedCats.reduce((s,c)=>s+dueOf(c),0), unpaid = fixedCats.filter(c=>dueOf(c)>0);

  const fresh = isCurrent() && !d.tx.length;

        <div class="center"><div><div class="pct num">${flexBudget?Math.round(flexSpent/flexBudget*100):0}%</div><div class="cap">used</div></div></div></div>
      <div class="stats"><button class="stat" data-act="tab" data-tab="activity"><div class="k">Income</div><div class="v num in">${fmt(d.income,1)}</div></button><button class="stat" data-act="tab" data-tab="activity"><div class="k">Spent</div><div class="v num">${fmt(outflow,1)}</div></button><button class="stat" data-act="tab" data-tab="budgets"><div class="k">Bills due</div><div class="v num">${fixedDue?fmt(fixedDue,1):`<span style="color:var(--good)">All paid</span>`}</div></button></div></div>

    <p class="foot">Estimates assume a fixed rate and on-time payments. When you log a loan payment with +, the principal part comes off that loan's balance.</p></section>`;

function payoffChart(a, b){
  const W=340, H=120, n = Math.max(a.length, b?.length||0)-1, max = Math.max(a[0]||1, 1);
  if (n<1) return '';
  const pt = s => s.map((v,i)=>`${(i/n*W).toFixed(1)},${(H-v/max*H).toFixed(1)}`).join(' ');
  const yrs = Math.floor(n/12), step = yrs>12?5:yrs>5?2:1, ticks = [];
  for (let y=0;y<=yrs;y+=step) ticks.push(y);
  const lab = v => v>=1000 ? '$'+Math.round(v/1000)+'k' : usd0.format(v);
  return `<svg viewBox="0 -6 ${W+40} ${H+24}" role="img" aria-label="Loan balance over time">
    ${[0,.5,1].map(f=>`<line class="gridl" x1="0" x2="${W}" y1="${H-f*H}" y2="${H-f*H}"/><text class="axis" x="${W+4}" y="${H-f*H+3}">${lab(max*f)}</text>`).join('')}
    ${b?`<polygon points="0,${H} ${pt(b)} ${((b.length-1)/n*W).toFixed(1)},${H}" fill="var(--accent)" opacity=".12"/>`:''}
    <polyline points="${pt(a)}" fill="none" stroke="var(--faint)" stroke-width="2" stroke-linejoin="round"/>
    ${b?`<polyline points="${pt(b)}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`:''}
    ${ticks.map(y=>`<text class="axis" x="${(y*12/n*W).toFixed(1)}" y="${H+16}" text-anchor="${y===0?'start':'middle'}">${y===0?'Now':now.getFullYear()+y}</text>`).join('')}</svg>`;
}

  requestAnimationFrame(()=>{
    document.querySelectorAll('.ring .val').forEach(el=>el.style.strokeDashoffset = el.dataset.off);
    const n = document.getElementById('leftNum'); if (n){ const to = +n.dataset.v; countUp(n, lastLeft ?? to*0.6, to); lastLeft = to; }

function countUp(el, from, to){
  if (from===to || matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = fmt(to); return; }
  const t0 = performance.now(), dur = 700;
  const step = t => { const k = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-k,4); el.textContent = fmt(Math.round(from+(to-from)*e)); if (k<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function setTab(tab){ if (tab===view.tab) { scrollTo({top:0,behavior:'smooth'}); render(); return; } view.tab = tab; render(); scrollTo(0,0); }
let toastTimer;
function toast(msg, undo){

  toastTimer = setTimeout(()=>el.classList.remove('show'), 3400);
}
const snapshot = () => JSON.parse(JSON.stringify(S));

let sd = null;

// Add transaction
let draft;
function usage(){ const n = {}; S.txns.slice(-200).forEach(t=>n[t.cat]=(n[t.cat]||0)+1); return n; }
function quickCats(kind){
  if (kind==='in') return ['paycheck','side','interest','refunds','other_in'].map(cat);
  const u = usage();
  // Most used first; with no history, everyday categories beat bills and savings (nobody logs rent five times a week).
  const rank = c => c.fixed || isGoal(c) ? 1 : 0;
  return [...spendCats()].sort((a,b)=>(u[b.id]||0)-(u[a.id]||0) || rank(a)-rank(b) || (b.w||0)-(a.w||0)).slice(0,7);

    <div class="seg"><button aria-pressed="${draft.kind==='out'}" data-act="kind" data-k="out">Expense</button><button aria-pressed="${draft.kind==='in'}" data-act="kind" data-k="in">Income</button></div>

const shortDay = d => { const t = iso(now), yd = iso(new Date(now.getFullYear(),now.getMonth(),now.getDate()-1));

function drawChips(){

function saveTx(){
  const cents = parseMoney(draft.s); if (!cents) return;
  const prev = snapshot(), c = cat(draft.cat);
  if (draft.id) removeTx(draft.id);
  if (!c.income && !c.loan && !S.cats[c.id]) S.cats[c.id] = {budget:0};
  const t = {id:draft.id||uid(), ts:draft.ts||Date.now(), date: sheet.querySelector('#date').value || iso(now), cat:draft.cat, amt: draft.kind==='in'?cents:-cents, note: sheet.querySelector('#note').value.trim()};
  if (c.loan){ const l = S.loans.find(x=>x.id===c.loan.id); const interest = Math.round(l.balance*l.apr/1200); t.principal = Math.max(0, Math.min(l.balance, cents-interest)); l.balance -= t.principal; }
  S.txns.push(t);
  const [y,m] = t.date.split('-').map(Number); view.y=y; view.m=m-1;
  closeSheet(); commit(draft.id ? 'Changes saved' : c.loan ? `Payment logged · ${fmt(t.principal)} to principal` : `${draft.kind==='in'?'Income':'Expense'} added · ${fmt(cents)}`, prev);
}

// Removes a transaction and gives back any loan principal it took off.
function removeTx(id){ const i = S.txns.findIndex(t=>t.id===id); if (i<0) return null; const [t] = S.txns.splice(i,1);
  if (t.principal){ const l = S.loans.find(x=>'loan:'+x.id===t.cat); if (l) l.balance += t.principal; } return t; }

// Suggests a budget: fixed bills as entered (or typical), then everyday categories by typical share of income, scaled to fit what's left.
function buildPlan(){
  const inc = obMonthly(), ids = Object.keys(ob.sel).filter(obMeta), prev = ob.plan; ob.plan = {};
  let fixedSum = ob.loans.reduce((s,l)=>s+l.payment,0);
  ids.filter(id=>obMeta(id).fixed).forEach(id=>{ const v = ob.amounts[id] ?? prev[id] ?? round5(inc*obMeta(id).w/100); ob.plan[id]=v; fixedSum+=v; });
  const flex = ids.filter(id=>!obMeta(id).fixed);
  const room = Math.max(0, inc - fixedSum), want = flex.reduce((s,id)=>s+inc*(obMeta(id).w||1)/100,0);
  const scale = want > room*0.95 ? (room*0.95)/(want||1) : 1;
  flex.forEach(id=>{ ob.plan[id] = prev[id] ?? ob.amounts[id] ?? round5(inc*(obMeta(id).w||1)/100*scale); });
}
const planTotal = () => Object.values(ob.plan).reduce((s,v)=>s+v,0) + ob.loans.reduce((s,l)=>s+l.payment,0);
function obNext(){
  const step = STEPS[ob.i];
  if (step==='income'){ ob.income.paycheck = parseMoney(onb.querySelector('#obpay').value); if (!ob.income.paycheck) return; }
  if (step==='bills') onb.querySelectorAll('[data-bill]').forEach(inp=>{ if (inp.value.trim()) ob.amounts[inp.dataset.bill]=parseMoney(inp.value); else delete ob.amounts[inp.dataset.bill]; });
  if (['income','cats','bills','loans'].includes(step)) ob.plan = {};
  ob.i++; ob.dir='enter'; drawOnb();
}
function obFinish(){
  onb.querySelectorAll('[data-plan]').forEach(inp=>ob.plan[inp.dataset.plan] = parseMoney(inp.value));
  const n = blank(); n.onboarded = true; n.income = {paycheck:ob.income.paycheck, freq:ob.income.freq, monthly:obMonthly()};
  Object.entries(ob.plan).forEach(([id,b])=>n.cats[id]={budget:b}); n.custom = ob.custom; n.loans = ob.loans; n.txns = S.sample ? [] : S.txns;
  S = n; save(); view.tab='home'; view.y=now.getFullYear(); view.m=now.getMonth(); lastLeft=null; render();
  ob.i++; ob.dir='enter'; drawOnb();
}

    if (key==='⌫') s = s.slice(0,-1);
    else if (key==='.') { if (!s.includes('.')) s = (s||'0')+'.'; }
    else { const [w,f] = s.split('.'); if ((f!==undefined && f.length>=2) || (f===undefined && (w||'').length>=7)) { const a = sheet.querySelector('#amt'); a.classList.remove('shake'); void a.offsetWidth; a.classList.add('shake'); return; } s = (s==='0'?'':s)+key; }
    draft.s = s; draft.fresh = false; drawAmt(); },
  pickcat: el => { draft.cat = el.dataset.id; sheet.querySelector('#picker')?.classList.remove('open'); drawChips(); drawAmt(); },
  allcats: () => openPicker(),
  closepicker: () => sheet.querySelector('#picker').classList.remove('open'),
  savetx: () => saveTx(),
  deltx: el => { const prev = snapshot(); if (!removeTx(el.dataset.id)) return; if (sheet.classList.contains('open')) closeSheet(); commit('Transaction deleted', prev); },
  edittx: el => { if (Date.now()-swipedAt < 400) return; const row = el.closest('.row'); if (row?.classList.contains('open')){ row.classList.remove('open'); row.style.transform=''; return; }
    const t = S.txns.find(x=>x.id===el.dataset.id); if (t) openAdd({tx:t}); },
  editcat: el => openEditCat(el.dataset.id),
  fixedtoggle: el => { const c = S.custom.find(x=>x.id===el.dataset.id); if (c) c.fixed = el.dataset.v==='1'; pressOne(el,'[data-act="fixedtoggle"]'); },
  savecat: el => { const prev = snapshot(); S.cats[el.dataset.id] = {budget: parseMoney(sheet.querySelector('#ebud').value)}; closeSheet(); commit('Budget updated', prev); },
  removecat: el => { const prev = snapshot(); const name = cat(el.dataset.id).name; delete S.cats[el.dataset.id]; closeSheet(); commit(`${esc(name)} removed`, prev); },
  managecats: () => openManage(),
  togglecat: el => { const id = el.dataset.id; if (S.cats[id]) delete S.cats[id]; else { const w = cat(id).w; S.cats[id] = {budget: S.income.monthly && w ? round5(S.income.monthly*w/100) : 0}; } el.setAttribute('aria-pressed', !!S.cats[id]); save(); },
  newcat: () => openNewCat('other', c=>{ const b = c.budget; delete c.budget; S.custom.push(c); S.cats[c.id] = {budget:b}; commit(`${esc(c.name)} added`); }),
  ncgroup: el => { newCat.group = el.dataset.g; pressOne(el,'[data-act="ncgroup"]'); drawNcPrev(); },
  ncicon: el => { newCat.icon = el.dataset.i; pressOne(el,'[data-act="ncicon"]'); drawNcPrev(); },
  ncfixed: el => { newCat.fixed = el.dataset.v==='1'; pressOne(el,'[data-act="ncfixed"]'); },
  savenewcat: () => { const inp = sheet.querySelector('#ncname'), name = inp.value.trim(); if (!name){ inp.focus(); toast('Give the category a name'); return; }
    const c = {id:'c_'+uid(), name, group:newCat.group, icon:newCat.icon, fixed:newCat.fixed, custom:true, budget:parseMoney(sheet.querySelector('#ncbud').value)};
    const done = newCat.onDone; closeSheet(); done(c); },
  newloan: () => openLoanForm(null),
  loan: el => openLoanDetail(el.dataset.id),
  editloan: el => openLoanForm(el.dataset.id),
  ltype: el => { loanDraft.type = el.dataset.t; pressOne(el,'[data-act="ltype"]'); },
  saveloan: () => saveLoan(),
  delloan: el => { if (!el.dataset.armed){ el.dataset.armed = 1; el.textContent = 'Tap again to delete'; return; }
    if (loanList()!==S.loans){ ob.loans = ob.loans.filter(l=>l.id!==el.dataset.id); closeSheet(); ob.dir=''; drawOnb(); return; }
    const prev = snapshot(); S.loans = S.loans.filter(l=>l.id!==el.dataset.id); closeSheet(); commit('Loan deleted', prev); },
  extra: el => { view.extra = Math.max(0, view.extra + +el.dataset.d); render(); },
  strategy: el => { view.strategy = el.dataset.s; render(); },
  theme: el => { setTheme(el.dataset.t); pressOne(el,'[data-act="theme"]'); },
  export: () => { const rows = [['date','category','amount','note'], ...[...S.txns].sort((x,y)=>x.date.localeCompare(y.date)).map(t=>[t.date, `"${cat(t.cat).name}"`, (t.amt/100).toFixed(2), `"${(t.note||'').replace(/"/g,'""')}"`])];
    const csv = rows.map(r=>r.join(',')).join('\n');
    (navigator.clipboard?.writeText(csv) ?? Promise.reject()).then(()=>toast(`Copied ${S.txns.length} transactions`), ()=>toast("Couldn't access the clipboard")); },
  erase: el => { if (!el.dataset.armed){ el.dataset.armed = 1; el.querySelector('.t').textContent = 'Tap again to erase everything'; return; } S = blank(); save(); closeSheet(); render(); startOnboarding(); },
  restart: () => { closeSheet(); startOnboarding(); },
  editincome: () => openIncome(),
  incfreq: el => { incDraft.freq = el.dataset.f; pressOne(el,'[data-act="incfreq"]'); drawIncome(); },
  saveincome: () => { const pay = parseMoney(sheet.querySelector('#incpay').value); if (!pay){ toast('Enter your paycheck amount'); return; }
    const prev = snapshot(); S.income = {paycheck:pay, freq:incDraft.freq, monthly:Math.round(pay*FREQ[incDraft.freq][0])}; closeSheet(); commit('Take-home pay updated', prev); },
  obnext: () => obNext(),
  obback: () => { if (STEPS[ob.i]==='plan') onb.querySelectorAll('[data-plan]').forEach(inp=>ob.plan[inp.dataset.plan]=parseMoney(inp.value)); ob.i--; ob.dir='back'; drawOnb(); },
  obcancel: () => { onb.hidden = true; },
  obsample: () => { S = sampleState(); save(); onb.hidden = true; render(); },
  obfreq: el => { ob.income.freq = el.dataset.f; onb.querySelectorAll('[data-act="obfreq"]').forEach(b=>b.setAttribute('aria-pressed', b===el)); onb.querySelector('#obmonthly').textContent = fmt(obMonthly(),1); },
  obcat: el => { const id = el.dataset.id; if (ob.sel[id]) delete ob.sel[id]; else ob.sel[id]=1; el.setAttribute('aria-pressed', !!ob.sel[id]); onb.querySelector('.onb-foot .btn').textContent = `Continue with ${Object.keys(ob.sel).length} categories`; },
  obnewcat: el => openNewCat(el.dataset.g, c=>{ if (c.budget) ob.amounts[c.id] = c.budget; delete c.budget; ob.custom.push(c); ob.sel[c.id]=1; ob.dir=''; drawOnb(); }),
  obfinish: () => obFinish(),
  obclose: () => { onb.hidden = true; render(); },
};
document.addEventListener('click', e=>{
  const tab = e.target.closest('.tab'); if (tab) return setTab(tab.dataset.tab);
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  A[el.dataset.act]?.(el, e);
});
document.addEventListener('input', e=>{
  const t = e.target;
  if (t.id==='q'){ view.q = t.value; document.getElementById('txlist').innerHTML = grouped(filterTx(monthData().tx)); }
  if (t.id==='pq'){ const q = t.value.trim().toLowerCase(); sheet.querySelectorAll('#plist .pcell').forEach(c=>c.hidden = !!q && !c.dataset.name.includes(q)); sheet.querySelectorAll('#plist .pg').forEach(g=>g.hidden = !g.querySelector('.pcell:not([hidden])')); }
  if (t.id==='obpay'){ ob.income.paycheck = parseMoney(t.value); onb.querySelector('#obmonthly').textContent = fmt(obMonthly(),1); onb.querySelector('#obgo').disabled = !ob.income.paycheck; }
  if (t.dataset.plan){ ob.plan[t.dataset.plan] = parseMoney(t.value); const left = obMonthly()-planTotal(); const v = onb.querySelector('#pleft'); v.textContent = fmt(Math.abs(left),1); v.className = 'v num '+(left>=0?'pos':'neg'); onb.querySelector('#plabel').textContent = left>=0?'Left unassigned':'Over your income by'; }
  if (['lbal','lapr','lpay'].includes(t.id)) updateLoanHint();
  if (t.id==='incpay') drawIncome();
  if (t.id==='date'){ const l = sheet.querySelector('#datel'); if (l) l.textContent = t.value ? shortDay(t.value) : 'Today'; }
  if (t.id==='lx'){ const l = S.loans.find(x=>x.id===t.dataset.id), x = +t.value, base = simulate([l]); sheet.querySelector('#lxv').textContent = fmt(x,1); sheet.querySelector('#lxout').innerHTML = loanExtraOut(l, x, base, simulate([l], x)); }
});
document.addEventListener('keydown', e=>{
  if (e.key==='Escape' && sheet.classList.contains('open')) return closeSheet();
  if (e.key==='Enter' && !onb.hidden && !sheet.classList.contains('open') && e.target.tagName==='INPUT'){ e.target.blur(); return; }
  if (!sheet.querySelector('#saveTx') || !sheet.classList.contains('open') || e.target.tagName==='INPUT') return;
  const k = e.key==='Backspace' ? '⌫' : e.key; const b = sheet.querySelector(`[data-act="key"][data-k="${CSS.escape(k)}"]`); if (b){ b.click(); e.preventDefault(); }
  if (e.key==='Enter') sheet.querySelector('#saveTx').click();
});

// Swipe to delete
let sw = null;
app.addEventListener('pointerdown', e=>{ const row = e.target.closest('.row-wrap[data-id] .row'); if (!row) return;
  document.querySelectorAll('.row.open').forEach(r=>{ if(r!==row){ r.classList.remove('open'); r.style.transform=''; } });
  sw = {row, x:e.clientX, y:e.clientY, base: row.classList.contains('open')?-88:0, dx:0, lock:null}; });
app.addEventListener('pointermove', e=>{ if (!sw) return; const dx = e.clientX-sw.x, dy = e.clientY-sw.y;
  if (sw.lock===null && (Math.abs(dx)>8||Math.abs(dy)>8)) sw.lock = Math.abs(dx)>Math.abs(dy) ? 'x':'y';
  if (sw.lock!=='x') return; sw.dx = dx; sw.row.classList.add('dragging'); sw.row.parentElement.classList.add('swiping');
  let x = sw.base+dx; if (x>0) x = x*.2; if (x<-88) x = -88 + (x+88)*.3; sw.row.style.transform = `translateX(${x}px)`; });
let swipedAt = 0;
const endSwipe = () => { if (!sw) return; const {row, base, dx, lock} = sw; row.classList.remove('dragging'); if (lock==='x') swipedAt = Date.now();
  if (lock==='x'){ const open = base+dx < -44; row.classList.toggle('open', open); row.style.transform = open?'translateX(-88px)':''; if (!open) setTimeout(()=>{ if(!row.classList.contains('open')) row.parentElement.classList.remove('swiping'); },350); } sw = null; };
app.addEventListener('pointerup', endSwipe); app.addEventListener('pointercancel', endSwipe);

// Large title collapses into a compact bar on scroll, like iOS navigation bars
const navbar = document.getElementById('navbar');
function onScroll(){ navbar.classList.toggle('show', scrollY > 44); }
addEventListener('scroll', onScroll, {passive:true});

// Theme
function getTheme(){ try{ return localStorage.getItem(KEY+'.theme')||'system'; }catch(e){ return 'system'; } }
function setTheme(t){ try{ localStorage.setItem(KEY+'.theme', t); }catch(e){} applyTheme(); }
function applyTheme(){ const t = getTheme(); if (t==='system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); }
applyTheme();

if (navigator.storage?.persist) navigator.storage.persist().catch(()=>{});
if ('serviceWorker' in navigator && location.protocol==='https:' && /github\.io$/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
if (!S.onboarded) startOnboarding();
})();
</script>
